spring.application.name=AgentTest

# ========== 全局配置（硅基流动） ==========
spring.ai.openai.base-url=https://api.siliconflow.cn/v1
spring.ai.openai.api-key=YOUR_SILICONFLOW_API_KEY

# ========== 指定嵌入模型名称 ==========
spring.ai.openai.embedding.options.model=BAAI/bge-large-zh-v1.5

# ========== 聊天单独覆盖回 DeepSeek ==========
spring.ai.openai.chat.base-url=https://api.deepseek.com
spring.ai.openai.chat.api-key=YOUR_DEEPSEEK_API_KEY
spring.ai.openai.chat.options.model=deepseek-v4-pro

# ========== 禁用无关功能 ==========
spring.ai.openai.audio.enabled=false
spring.ai.openai.image.enabled=false

# ========== 服务器端口 ==========
server.port=8086

# ========== Nacos 服务发现配置 ==========
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848
spring.cloud.nacos.discovery.metadata.version=v1.0
spring.cloud.nacos.discovery.metadata.env=dev
spring.cloud.nacos.discovery.metadata.region=chengdu

# ========== Actuator 健康检查配置 ==========
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

info.app.name=Agent-Service
info.app.version=1.0.0
info.app.description=AI Agent for Seckill System

# ========== Redis 配置 ==========
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

# ========== Sentinel 配置 ==========
spring.cloud.sentinel.enabled=true
spring.cloud.sentinel.eager=true
spring.cloud.sentinel.transport.dashboard=localhost:8858
spring.cloud.sentinel.transport.port=8719

# ========== 链路追踪配置 ==========
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.tracing.sampling.probability=1.0

# ========== 提示词抽取 ==========
agent.prompts.structured=你是一个智能助手，必须严格按照下面的 JSON 格式返回结果，不要输出任何其他文字。\n如果用户询问商品信息，返回格式：\n{\n    "type": "product_list",\n    "data": [\n        {"id": "p1", "name": "无线耳机", "price": 399.0, "stock": 100},\n        {"id": "p2", "name": "智能手表", "price": 199.0, "stock": 50}\n    ],\n    "summary": "为您找到以下商品"\n}\n如果用户询问价格，返回格式：\n{\n    "type": "price",\n    "data": {"productId": "p1", "price": 399.0},\n    "summary": "该商品当前价格为 399 元"\n}\n如果是一般对话，返回格式：\n{\n    "type": "text",\n    "data": {"content": "您的回复内容"},\n    "summary": "回复"\n}\n请确保返回的 JSON 是有效的，且字段名完全一致。

agent.prompts.rag=你是一个严格基于资料回答的助手。\n请根据下面【参考资料】的内容回答用户的问题。\n如果参考资料里没有提到的信息，请直接回答"资料中未提及"，绝对不要编造。\n\n【参考资料】\n%s

agent.prompts.orchestrate=用户的问题：%s\n工具执行结果：%s\n请根据这些结果回答用户的问题。